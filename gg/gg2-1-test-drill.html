<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренажёр к тесту · Unit 7 — GG 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ GG2.1 test-prep drill (hwdt) — NO TIMER by Elena's
   order ("Make preparation hwdt without a timer"); wrong answer → a
   short clear explanation (her order). One card = one item, shuffled
   every run; a missed card comes back once before the end screen.
   Mint, phone-first, Russian chrome. No results form wired — the end
   screen carries the notebook list. */
:root{
  --mint:#95E1D3; --mint-deep:#5ecbb8; --peach:#FCE38A;
  --lavender:#C8B6FF; --lavender-deep:#9a7fff; --cream:#FFF8F0;
  --pink:#FF8FAB; --ink:#2D3436; --ink-soft:#636e72; --white:#fff;
  --ok:#2e9e6b; --bad:#e05252; --blue:#3a6ea5; --blue-bg:#d6e8f7;
  --radius:22px; --shadow:0 10px 30px rgba(45,52,54,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Nunito',system-ui,sans-serif;background:var(--cream);color:var(--ink);
  min-height:100vh;padding:4vh 4vw 8vh;display:flex;flex-direction:column;gap:2vh;
  align-items:stretch;max-width:640px;margin:0 auto}
.eyebrow{font-size:clamp(.95rem,2.6vw,1.15rem);font-weight:800;letter-spacing:.12em;
  text-transform:uppercase;color:var(--lavender-deep)}
h1{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(1.6rem,5.6vw,2.4rem);line-height:1.15}
.accent-line{width:110px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--mint),var(--lavender))}
.stamp{display:inline-block;font-weight:800;font-size:.8rem;color:var(--ink-soft);
  border:2px solid #e7e0d8;border-radius:99px;padding:.14em .7em;background:#fff;
  letter-spacing:.04em;vertical-align:middle;margin-left:.6em}
.notimer{background:#eafbf6;border-radius:16px;padding:.55em 1em;font-weight:800;
  font-size:clamp(.95rem,2.6vw,1.1rem);color:var(--ink-soft)}
.card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:clamp(14px,2.4vh,24px) clamp(16px,3vw,28px)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:.6em;flex-wrap:wrap;
  font-weight:800;font-size:clamp(.95rem,2.7vw,1.15rem);color:var(--ink-soft)}
.chips{background:#fff8db;border-radius:99px;padding:.2em .8em;border:2px solid var(--peach)}
.task{font-weight:800;color:var(--ink-soft);font-size:clamp(.95rem,2.7vw,1.15rem);
  text-transform:uppercase;letter-spacing:.06em}
.prompt{font-family:'Fredoka',sans-serif;font-weight:600;
  font-size:clamp(1.35rem,4.8vw,1.9rem);line-height:1.45;margin:.35em 0 .2em}
.hint{font-size:clamp(1rem,3vw,1.2rem);color:var(--ink-soft)}
.inrow{display:flex;gap:.6em;margin-top:.9em;flex-wrap:wrap}
input{flex:1 1 12em;font-family:'Nunito',sans-serif;font-size:clamp(1.15rem,3.6vw,1.5rem);
  border:3px solid var(--lavender);border-radius:14px;padding:.45em .8em;color:var(--ink);
  min-width:0;background:#fbf9ff}
input:focus{outline:none;border-color:var(--mint-deep)}
.btn{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(1.05rem,3.2vw,1.3rem);
  border:none;border-radius:99px;padding:.55em 1.6em;cursor:pointer;
  background:var(--mint);color:var(--ink);box-shadow:var(--shadow);transition:transform .15s ease}
.btn:hover{transform:scale(1.05)}
.btn.gold{background:var(--peach)}
.choices{display:flex;flex-direction:column;gap:.6em;margin-top:.9em}
.choice{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(1.15rem,3.6vw,1.5rem);
  border:3px solid var(--lavender);border-radius:16px;padding:.5em 1em;cursor:pointer;
  background:#fbf9ff;color:var(--ink);text-align:left;transition:transform .15s ease}
.choice:hover{transform:scale(1.02);border-color:var(--mint-deep)}
.fb{display:none;margin-top:.9em;border-radius:16px;padding:.8em 1em;
  font-size:clamp(1.05rem,3.1vw,1.3rem);line-height:1.55;animation:pop .4s ease}
.fb.good{background:#e3f7ee;border:2px solid var(--ok)}
.fb.bad{background:#ffe9ec;border:2px solid var(--bad)}
.fb.show{display:block}
.fb .verdict{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(1.2rem,3.8vw,1.5rem)}
.fb.good .verdict{color:var(--ok)}
.fb.bad .verdict{color:var(--bad)}
.fb .why{margin-top:.3em}
.fb .ans{font-weight:800}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.next{margin-top:.8em;display:none}
.next.show{display:inline-block}
.end .score{font-family:'Fredoka',sans-serif;font-weight:700;
  font-size:clamp(1.8rem,6.5vw,2.6rem);color:var(--mint-deep)}
.end .misses{background:#fff8db;border-radius:16px;padding:.8em 1em;margin-top:.7em;
  font-size:clamp(1.05rem,3.1vw,1.3rem);line-height:1.6}
.end .nomiss{background:#e3f7ee;border-radius:16px;padding:.8em 1em;margin-top:.7em;
  font-size:clamp(1.05rem,3.1vw,1.3rem)}
.warm{font-size:clamp(1.1rem,3.2vw,1.4rem);text-align:center}
</style>
</head>
<body>

<div class="eyebrow">Готовимся к тесту · Go Getter 1 · Unit 7</div>
<h1>Тренажёр 🧪 <span class="stamp">build 08.10 · v1</span></h1>
<div class="accent-line"></div>

<div class="notimer">🐢 Без таймера — отвечай спокойно, тут никто не торопится.</div>

<div class="card" id="play">
  <div class="bar">
    <span id="step">карточка 1 из 16</span>
    <span class="chips">⭐ <span id="score">0</span></span>
  </div>
  <div style="margin-top:.7em">
    <div class="task" id="task"></div>
    <div class="prompt" id="prompt"></div>
    <div class="hint" id="hint"></div>
    <div class="inrow" id="inrow">
      <input id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ответ по-английски">
      <button class="btn" id="check">проверить</button>
    </div>
    <div class="choices" id="choices"></div>
    <div class="fb" id="fb">
      <div class="verdict" id="verdict"></div>
      <div class="why" id="why"></div>
      <button class="btn gold next" id="next">дальше →</button>
    </div>
  </div>
</div>

<div class="card end" id="end" style="display:none">
  <div class="score" id="finalScore"></div>
  <div id="missBox"></div>
  <div style="margin-top:.9em"><button class="btn" id="again">начать заново 🔁</button></div>
</div>

<div class="card">
  <p class="warm">Тест будет по этим заданиям — прорешал тренажёр, и на уроке всё узнаешь! 💪</p>
</div>

<script>
/* One card = one item. type = spell the word; choice = tap one of two.
   norm() forgives capital letters and missing apostrophes.
   Lap 1 = all cards; wrong cards come back once (lap 2, no star);
   stars count FIRST-TRY correct answers only. */
const CARDS = [
  {task:'Слово', prompt:'a long thin animal with no legs', ans:['snake'],
   why:'Змея 🐍 — snake: длинная, ног нет.'},
  {task:'Слово', prompt:'it\'s got eight legs and it makes a web', ans:['spider'],
   why:'Паук 🕷 — spider: восемь ног, плетёт паутину.'},
  {task:'Слово', prompt:'a small pet with long ears that likes carrots', ans:['rabbit'],
   why:'Кролик 🐰 — rabbit: длинные уши, любит морковку.'},
  {task:'Слово', prompt:'it can swim and jump, and it\'s green', ans:['frog'],
   why:'Лягушка 🐸 — frog: и плавает, и прыгает.'},
  {task:'Слово', prompt:'a big wild cat with long hair around its head', ans:['lion'],
   why:'Лев 🦁 — lion: большая дикая кошка с гривой.'},
  {task:'Слово', prompt:'a slow animal with a hard round house on its back', ans:['tortoise'],
   why:'Черепаха 🐢 — tortoise: панцирь-домик, ходит медленно.'},
  {task:'Слово', prompt:'a big green animal with a long mouth and many big teeth', ans:['crocodile'],
   why:'Крокодил 🐊 — crocodile: длинная пасть и много зубов.'},
  {task:'Слово', prompt:'not safe — it can hurt you', ans:['dangerous'],
   why:'Dangerous = опасный. Safe = безопасный, dangerous — наоборот.'},
  {task:'Слово', prompt:'the opposite of fast', ans:['slow'],
   why:'Slow = медленный: the opposite of fast (быстрый).'},
  {task:'Не забудь don\'t / doesn\'t', prompt:'Thomas ______ to school on Saturdays. (go)',
   ans:["doesn't go","doesnt go","doesntgo"], norm:true,
   why:'Thomas = he → he doesn\'t go. После doesn\'t глагол БЕЗ -s.'},
  {task:'Не забудь don\'t / doesn\'t', prompt:'Steve and Gloria ______ to music in the evening. (listen)',
   ans:["don't listen","dont listen","dontlisten"], norm:true,
   why:'Steve and Gloria = they → they don\'t listen. Они — don\'t.'},
  {task:'Не забудь don\'t / doesn\'t', prompt:'Emma ______ a bike to school. She walks. (ride)',
   ans:["doesn't ride","doesnt ride","doesnt ride"], norm:true,
   why:'Emma = she → she doesn\'t ride. She walks — она ходит пешком.'},
  {task:'Выбери: Do или Does', prompt:'___ the students have lunch at twelve o\'clock?',
   choices:['Do','Does'], ans:0,
   why:'The students = они (много) → Do the students have lunch…?'},
  {task:'Выбери: Do или Does', prompt:'___ Lucy go to bed early on Sundays?',
   choices:['Do','Does'], ans:1,
   why:'Lucy = she → Does Lucy go…? После Does глагол БЕЗ -s: go, не goes.'},
  {task:'Разговор в музее', prompt:'___ I help you?',
   choices:['Can','Do'], ans:0,
   why:'Can I help you? — так вежливо предлагают помощь.'},
  {task:'Разговор в музее', prompt:'___ four pounds, please.',
   choices:["That's","They're"], ans:0,
   why:'Цена одна → That\'s four pounds. That\'s = это (стоит).'}
];
/* shuffle */
for (let i = CARDS.length - 1; i > 0; i--){
  const j = Math.floor(Math.random() * (i + 1));
  [CARDS[i], CARDS[j]] = [CARDS[j], CARDS[i]];
}
let queue = CARDS.slice(), requeue = [], lap2 = false;
let score = 0, firstTry = 0, missed = [], locked = false;
const total = CARDS.length;
const el = id => document.getElementById(id);
function norm(s){ return s.toLowerCase().trim().replace(/['’`]/g,'').replace(/\s+/g,' '); }
function rightText(c){ return c.choices ? c.choices[c.ans] : c.ans[0]; }
function draw(){
  locked = false;
  const c = queue[0];
  el('step').textContent = lap2 ? '🔁 повторим сложное · осталось ' + queue.length
                               : 'карточка ' + (total - queue.length + 1) + ' из ' + total;
  el('score').textContent = score;
  el('task').textContent = c.task;
  el('prompt').textContent = c.prompt;
  el('hint').textContent = c.choices ? 'нажми правильное' : 'напиши по-английски';
  el('fb').className = 'fb'; el('next').classList.remove('show');
  el('inrow').style.display = c.choices ? 'none' : 'flex';
  el('choices').style.display = c.choices ? 'flex' : 'none';
  el('choices').innerHTML = '';
  if (c.choices){
    c.choices.forEach((t, k) => {
      const b = document.createElement('button');
      b.className = 'choice'; b.textContent = t;
      b.onclick = () => answer(k === c.ans, c);
      el('choices').appendChild(b);
    });
  } else {
    el('inp').value = '';
    setTimeout(() => el('inp').focus(), 60);
  }
}
function answer(ok, c){
  if (locked) return; locked = true;
  const fb = el('fb'), v = el('verdict'), w = el('why');
  if (ok){
    score++;
    if (!lap2) firstTry++;
    fb.className = 'fb good show';
    v.textContent = '✓ Верно! +1 ⭐';
    w.innerHTML = 'Правильно: <span class="ans">' + rightText(c) + '</span>';
    el('next').classList.add('show');
    setTimeout(() => { if (locked && el('fb').classList.contains('good')) advance(); }, 1600);
  } else {
    if (!lap2) missed.push(rightText(c));
    fb.className = 'fb bad show';
    v.textContent = '✗ Не совсем.';
    w.innerHTML = 'Правильно: <span class="ans">' + rightText(c) + '</span>. ' + c.why +
      '<br>Запиши в тетрадь! 🔁 Эта карточка вернётся в конце.';
    requeue.push(c);
    el('next').classList.add('show');
  }
  el('score').textContent = score;
}
function check(){
  const c = queue[0];
  const raw = el('inp').value;
  if (!raw.trim()) return;
  const ok = c.norm ? c.ans.some(a => norm(a) === norm(raw))
                    : c.ans.some(a => a.toLowerCase() === norm(raw));
  answer(ok, c);
}
function advance(){
  queue.shift();
  if (queue.length){ draw(); return; }
  if (requeue.length){
    queue = requeue.slice(); requeue = []; lap2 = true;
    setTimeout(draw, 400);
    return;
  }
  el('play').style.display = 'none';
  el('end').style.display = 'block';
  el('finalScore').textContent = '⭐ ' + firstTry + ' из ' + total + ' с первого раза!';
  const missEl = el('missBox');
  if (firstTry === total){
    missEl.innerHTML = '<div class="nomiss">Ни одной ошибки — ты готов(а) к тесту! 🏆</div>';
  } else {
    const uniq = missed.filter((v, i, a) => a.indexOf(v) === i);
    missEl.innerHTML = '<div class="misses">📝 <b>Запиши в тетрадь и повтори:</b><br>' +
      uniq.map(n => '• ' + n).join('<br>') + '</div>';
  }
}
el('check').onclick = check;
el('inp').addEventListener('keydown', e => { if (e.key === 'Enter' && !locked) check(); });
el('next').onclick = advance;
el('again').onclick = () => location.reload();
draw();
</script>
</body>
</html>
