<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Same or different</title>
<meta property="og:title" content="Same or different">
<meta property="og:description" content="Flip two cards — SAME or DIFFERENT? Word+picture on the card, or picture ↔ word apart. A memory and comparing game.">
<style>
:root{
  --mint:#95E1D3;--mint-deep:#5ecbb8;--peach:#FCE38A;--lavender:#C8B6FF;
  --lavender-deep:#9a7fff;--cream:#FFF8F0;--pink:#FF8FAB;--ink:#2D3436;
  --ink-soft:#636e72;--white:#ffffff;--radius:22px;
  --shadow:0 10px 30px rgba(45,52,54,.12);--shadow-lg:0 20px 50px rgba(45,52,54,.18);
}
*{margin:0;padding:0;box-sizing:border-box}
.sndbtn{position:fixed;top:2vh;right:2vw;z-index:50;font-size:clamp(1.6rem,3vw,2.4rem);line-height:1;background:var(--white);border:none;border-radius:99px;box-shadow:var(--shadow);padding:.28em .4em;cursor:pointer;transition:transform .15s ease}
.sndbtn:hover{transform:scale(1.08)}
body{font-family:'Nunito',system-ui,sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:2vh;padding:5vh 4vw 8vh}
.eyebrow{font-size:clamp(1rem,1.8vw,1.4rem);font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--lavender-deep)}
h1{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(2rem,5vw,3.6rem);line-height:1.1}
.accent-line{width:120px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--mint),var(--lavender))}
.task{background:var(--peach);border-radius:99px;padding:.45em 1.2em;font-size:clamp(1.2rem,2.1vw,1.7rem);font-weight:800}
.setrow{display:flex;gap:.6em;flex-wrap:wrap;justify-content:center}
.setchip{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(1rem,1.8vw,1.4rem);border:2px solid #d8dee6;background:#fff;color:var(--ink-soft);cursor:pointer;border-radius:99px;padding:.35em 1em;transition:all .15s ease}
.setchip.on{background:var(--lavender);border-color:var(--lavender-deep);color:#fff}
.modechip.on{background:var(--pink);border-color:var(--pink);color:#fff}
.magic{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:clamp(10px,1.6vh,18px) clamp(16px,2vw,28px);text-align:center;width:100%}
.magic p{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(1.6rem,4.5vh,3.2rem);line-height:1.3}
.mp-grid{display:grid;gap:clamp(8px,1.4vw,18px);justify-content:center;justify-items:center;width:100%}
.mp-card{
  width:100%;max-width:clamp(84px,15vh,140px);height:auto;aspect-ratio:1;border:none;border-radius:18px;cursor:pointer;
  background:var(--mint);box-shadow:var(--shadow);padding:0;
  font-family:'Fredoka',sans-serif;font-weight:700;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.12em;
  font-size:clamp(2.1rem,7vh,4rem);line-height:1;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1),background .18s ease,box-shadow .18s ease;
}
.mp-card:hover{transform:translateY(-3px) scale(1.03)}
.mp-card .mp-back{font-size:1.1em}
.mp-card .mp-word{font-size:clamp(.85rem,1.6vw,1.15rem)}
.mp-card img.mp-img{width:74%;height:auto;max-height:66%;object-fit:contain}
.fs-face img.fs-img{max-width:min(58vw,58vh);max-height:50vh;object-fit:contain;background:#fff;border-radius:22px;padding:14px;box-sizing:border-box}
.fs-face-inner{display:flex;flex-direction:column;align-items:center;gap:1.5vh}
.mp-card.up{background:var(--white)}
.mp-card.ok{background:var(--white);box-shadow:0 0 0 6px var(--mint),var(--shadow-lg);cursor:default}
.mp-card.ok:hover{transform:none}
.mp-card.no{background:#ffe1e8}
.mp-status{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(1.1rem,2vw,1.6rem);color:var(--ink-soft);text-align:center;min-height:1.4em}
.reveal-btn{font-family:'Fredoka',sans-serif;font-size:clamp(1.15rem,2vw,1.6rem);font-weight:700;color:var(--ink);background:var(--mint);border:none;border-radius:99px;padding:.55em 1.5em;cursor:pointer;transition:transform .15s ease;box-shadow:var(--shadow)}
.reveal-btn:hover{transform:scale(1.06)}
.secret{display:flex;flex-direction:column;align-items:center;gap:1.2vh;animation:secpop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes secpop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.secret-card{font-family:'Fredoka',sans-serif;font-weight:700;width:clamp(150px,26vh,230px);height:clamp(150px,26vh,230px);border:none;border-radius:26px;background:var(--lavender);box-shadow:var(--shadow-lg);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.08em;color:#fff;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.secret-card:hover{transform:translateY(-3px) scale(1.03)}
.secret-card .sec-pic{font-size:clamp(4rem,12vh,7rem);line-height:1}
.secret-card .sec-word{font-size:clamp(1.1rem,2vw,1.5rem)}
.secret-hint{font-size:clamp(.95rem,1.6vw,1.2rem);color:var(--ink-soft);font-weight:700}
.secret-label{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(1.2rem,2.2vw,1.8rem);color:var(--lavender-deep);text-align:center}
.fs{position:fixed;inset:0;z-index:99;background:rgba(45,52,54,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;cursor:pointer;animation:fsin .18s ease}
@keyframes fsin{from{opacity:0}to{opacity:1}}
.fs-x{position:absolute;top:2.5vh;right:2.5vw;font-family:'Fredoka',sans-serif;font-size:clamp(1.4rem,3vw,2.2rem);font-weight:700;color:#fff;background:rgba(255,255,255,.14);border:none;border-radius:99px;width:2.2em;height:2.2em;cursor:pointer}
.fs-face{display:flex;flex-direction:column;align-items:center;gap:1.5vh}
.fs-pic{font-size:min(56vh,56vw);line-height:1.05}
.fs-pic.duo{font-size:min(38vh,38vw)}
.fs-word{font-family:'Fredoka',sans-serif;font-weight:700;font-size:min(15vh,15vw);color:#fff}
.fs-key{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(1.1rem,2vw,1.6rem);color:var(--ink);background:var(--peach);border:none;border-radius:99px;padding:.5em 1.4em;cursor:pointer;box-shadow:var(--shadow)}
.fs-hint{color:rgba(255,255,255,.72);font-weight:800;font-size:clamp(1rem,1.8vw,1.4rem)}
</style>
</head>
<body>
<button class="sndbtn" id="sndbtn" type="button" title="Sound on / off">🔊</button>
<div class="eyebrow">Game time 🃏</div>
<h1>Same or different!</h1>
<div class="accent-line"></div>
<div class="task">🎯 Flip two — SAME or DIFFERENT?</div>
<div class="setrow" id="setrow"></div>
<div class="setrow" id="moderow"></div>
<div class="magic"><p>SAME! 🙂 &nbsp;·&nbsp; DIFFERENT! 🙃</p></div>
<div class="mp-grid" id="mpgrid"></div>
<div class="mp-status" id="mpstatus"></div>
<div class="secret" id="mpsecret" style="display:none">
  <div class="secret-label">🤫 Psst… a SECRET WORD! Tell it to the teacher — the first team wins! 🏆</div>
  <button class="secret-card" id="secretcard" type="button"></button>
  <div class="secret-hint">👆 tap the card — big for the whole class</div>
</div>
<button class="reveal-btn" id="mpagain" style="display:none" onclick="mpDeal()">↺ Play again</button>
<div class="fs" id="fsbox" style="display:none">
  <button class="fs-x" id="fsx" type="button">✕</button>
  <div class="fs-face" id="fsface"></div>
  <button class="fs-key" id="fskey" type="button" style="display:none">🔑 show the word</button>
  <div class="fs-hint">tap anywhere to close 👆</div>
</div>

<script>
/* SAME OR DIFFERENT — the shelf game (Elena's name 19.11; born inside
   KB 1 U2 L11 as «Matching pairs», her word 30.10: "This game is awesome… Move it to the appropriate folder").
   Flip two cards: a matching pair locks green — SAME!; a miss flips back —
   DIFFERENT! Tries are counted, not punished. Three swappable word sets;
   every deal reshuffles. Name-free by the shelf law.
   TWO PLAY OPTIONS PER TOPIC (Elena's ask 31.10): 🖼️+🔤 on the card —
   every card shows the picture and the word, match the twins (the classic);
   🖼️ ↔ 🔤 apart — the picture is one card, the word is another, match
   the pair. Same SAME/DIFFERENT rules in both.
   THE FINISH (Elena's ask 31.10, the team race): 4 / 4 solved → a SECRET
   WORD card pops — one random item of the set, picture only. The team
   tells the teacher the word = finished; the first team wins. The teacher
   taps the card to check (the word is the key).
   THE BIG REVEAL (Elena's ask 31.10, the projector): the child at the
   board covers the cards, so EVERY flip opens the face FULL SCREEN —
   tap anywhere to close. The pair resolves only after the second big
   look, so the class sees both faces before SAME/DIFFERENT. The secret
   card opens fullscreen too — 🔑 shows the word (the teacher's key).
   THE TOYS SET (Elena's ask 18.11, KB 1 Unit 3 — the kids play WITHOUT
   her): the six U3 toys as Cambridge flashcard crops (media/toys-*.png,
   lessons 013/014 media; her «there must be more cards» the same day →
   6 pairs = 12 cards, the counts computed from the set). 19.11 — her ask:
   the APART OPTION for Toys too, so the set plays BOTH ways now; the
   finish stays the easy «You did it!» (noSecret — no secret-word race),
   the voice rides the 🔊 toggle.
   Deep links: ?set=toys · ?set=toys&mode=apart.
   THE SM3 SET (Elena's ask 19.11, Super Minds 3 U1 «Meet The Explorers»):
   the cellar · find · a lot of books · upstairs · downstairs · courage —
   six pairs, 12 cards, the TEACHER game (two options + the secret race).
   cellar/upstairs/downstairs = the course's real photo flashcards
   (media/sm3-*.png, Flashcards (2nd ed).pdf pages 9/1/5 — the cellar page
   sat rotated 90° in the PDF). find / a lot of books / courage have NO
   flashcards in the pack — Elena GENERATED all three the same day
   (media/sm3-find/books/courage.jpg, her Downloads 19.11, picture-checked:
   find = the explorer + magnifying glass + the toy car; a lot of books =
   the boy + the book stack; courage = the little superhero) and the
   emoji stand-ins were so loved they are now the SHELF SYMBOLS —
   find=🔍 · a lot of books=📚 · courage=🦁 («use them in other
   activities when you need to symbolise it, not illustrate»). Deep link: ?set=sm3. */
const SETS=[
  {name:'Animals 🐾', pairs:[['🐱','a cat'],['🐶','a dog'],['🐭','a mouse'],['🐰','a rabbit']]},
  {name:'School ✏️', pairs:[['✏️','a pencil'],['📚','a book'],['🎒','a bag'],['✂️','scissors']]},
  {name:'Food 🍎', pairs:[['🍎','an apple'],['🍌','a banana'],['🥕','a carrot'],['🍇','grapes']]},
  {name:'Toys 🧸', noSecret:true, pairs:[['media/toys-ball.png','a ball'],['media/toys-bike.png','a bike'],['media/toys-car.png','a car'],['media/toys-doll.png','a doll'],['media/toys-train.png','a train'],['media/toys-computer.png','a computer']]},
  {name:'SM3 🏠', pairs:[['media/sm3-cellar.png','the cellar'],['media/sm3-find.jpg','find'],['media/sm3-books.jpg','a lot of books'],['media/sm3-upstairs.png','upstairs'],['media/sm3-downstairs.png','downstairs'],['media/sm3-courage.jpg','courage']]}
];
const MODES=[
  {name:'🖼️+🔤 on the card',apart:false},
  {name:'🖼️ ↔ 🔤 apart',apart:true}
];
/* art helper: a pair face is either an emoji or an image path (holds '/') */
function mpArt(art,big){
  if(art.indexOf('/')>-1)return '<img src="'+art+'" alt="" class="'+(big?'fs-img':'mp-img')+'">';
  return '<span class="'+(big?'fs-pic':'mp-back')+'">'+art+'</span>';
}
/* THE VOICE + THE SOUND TOGGLE (Elena's ask 19.11: «sometimes I want it
   to be silent, sometimes I want it to speak»): the 🔊/🔇 button governs
   EVERY set — when on, the word is spoken on every flip and the verdicts
   speak too; when off, the game is silent. The choice is remembered.
   LIVE TTS STAYS SILENT IN THIS PANE — the drive proves the CALLS only. */
let mpSound=true;
try{mpSound=localStorage.getItem('matching-pairs-sound')!=='off';}catch(e){}
function mpApplySound(){
  const b=document.getElementById('sndbtn');
  if(b){b.textContent=mpSound?'🔊':'🔇';b.title=mpSound?'Sound on — tap to mute':'Sound off — tap to unmute';}
}
function mpSetSound(on){
  mpSound=on;
  try{localStorage.setItem('matching-pairs-sound',on?'on':'off');}catch(e){}
  mpApplySound();
}
function mpToggleSound(){
  mpSetSound(!mpSound);
  if(mpSound)mpSay('Sound on!');
}
function mpSay(text){
  if(!mpSound)return;
  try{
    if(!window.speechSynthesis)return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-GB';u.rate=.85;
    const v=speechSynthesis.getVoices().find(function(v){return v.lang&&v.lang.indexOf('en-GB')>-1;});
    if(v)u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}
let curSet=0,curMode=0,mpA=null,mpLock=false,mpFound=0,mpTries=0,mpSecret=null,mpPending=null;
function renderModes(){
  const row=document.getElementById('moderow');if(!row)return;
  row.style.display='';
  row.innerHTML='';
  MODES.forEach(function(m,i){
    const b=document.createElement('button');b.className='setchip modechip'+(i===curMode?' on':'');b.type='button';
    b.textContent=m.name;b.onclick=function(){curMode=i;renderModes();mpDeal();};
    row.appendChild(b);
  });
}
function renderSets(){
  const row=document.getElementById('setrow');row.innerHTML='';
  SETS.forEach(function(s,i){
    const b=document.createElement('button');b.className='setchip'+(i===curSet?' on':'');b.type='button';
    b.textContent=s.name;b.onclick=function(){curSet=i;renderSets();renderModes();mpDeal();};
    row.appendChild(b);
  });
}
function mpDeal(){
  const g=document.getElementById('mpgrid');if(!g)return;
  const P=SETS[curSet].pairs;
  let deck;
  if(MODES[curMode].apart){
    deck=[];
    P.forEach(function(p){
      deck.push({w:p[0],n:'',r:Math.random()});
      deck.push({w:p[0],n:p[1],r:Math.random()});
    });
    deck.sort(function(a,b){return a.r-b.r;});
  }else{
    deck=[...P,...P].map(function(p){return {w:p[0],n:p[1],r:Math.random()};}).sort(function(a,b){return a.r-b.r;});
  }
  g.innerHTML='';
  /* EXACTLY 2 ROWS (Elena's ask 18.11): half the deck per row */
  g.style.gridTemplateColumns='repeat('+Math.ceil(deck.length/2)+',minmax(0,1fr))';
  deck.forEach(function(c){
    const b=document.createElement('button');b.className='mp-card';b.type='button';
    b.innerHTML='<span class="mp-back">❓</span>';
    b.dataset.w=c.w;b.dataset.n=c.n;
    b.onclick=function(){mpFlip(b);};
    g.appendChild(b);
  });
  mpA=null;mpLock=false;mpFound=0;mpTries=0;mpSecret=null;
  g.style.display='';
  const sec=document.getElementById('mpsecret');if(sec)sec.style.display='none';
  const s=document.getElementById('mpstatus');
  if(s)s.textContent=MODES[curMode].apart?'Find each picture and its word!':'Click two cards — SAME or DIFFERENT?';
  const ag=document.getElementById('mpagain');if(ag)ag.style.display='none';
}
function mpFlip(card){
  if(mpLock||card.classList.contains('up')||card.classList.contains('ok'))return;
  card.classList.add('up');
  card.innerHTML=MODES[curMode].apart
    ?(card.dataset.n?'<span class="mp-word">'+card.dataset.n+'</span>':mpArt(card.dataset.w,false))
    :mpArt(card.dataset.w,false)+'<span class="mp-word">'+card.dataset.n+'</span>';
  if(!mpA){
    mpA=card;
    if(card.dataset.n)mpSay(card.dataset.n);
    mpShowFs(card);
    return;
  }
  mpLock=true;
  mpPending={first:mpA,second:card};
  mpA=null;
  if(card.dataset.n)mpSay(card.dataset.n);
  mpShowFs(card);
}
function mpResolve(){
  const first=mpPending.first,card=mpPending.second;
  mpPending=null;
  mpTries++;
  /* the pair count is COMPUTED from the live set — never typed (the deal-line law) */
  const total=SETS[curSet].pairs.length;
  const s=document.getElementById('mpstatus');
  if(first.dataset.w===card.dataset.w){
    mpLock=false;
    first.classList.remove('up');first.classList.add('ok');
    card.classList.remove('up');card.classList.add('ok');
    mpFound++;
    if(mpFound===total){
      if(SETS[curSet].noSecret){
        /* the easy finish: NO secret, NO teacher — just the celebration */
        if(s)s.textContent='You did it! 🎉 '+total+' / '+total+' — '+mpTries+' tries! Play again?';
        mpSay('Well done!');
        const ag=document.getElementById('mpagain');if(ag)ag.style.display='';
      }else{
      mpSecret=SETS[curSet].pairs[Math.floor(Math.random()*SETS[curSet].pairs.length)];
      if(s)s.textContent='SAME! 🙂 '+total+' / '+total+' — '+mpTries+' tries! You solved the puzzle! 🎉';
      /* the board transforms into the secret — the grid steps aside so the
         finale fits on screen with NO page scroll (this webview never
         scrolls programmatically; the deck's own transform-the-board law) */
      const g=document.getElementById('mpgrid');if(g)g.style.display='none';
      const sec=document.getElementById('mpsecret');
      if(sec){
        sec.style.display='';
        const sc=document.getElementById('secretcard');
        if(sc)sc.innerHTML='<span class="sec-pic">'+mpSecret[0]+'</span>';
        setTimeout(function(){sec.scrollIntoView({behavior:'smooth',block:'center'});},550);
      }
      const ag=document.getElementById('mpagain');if(ag)ag.style.display='';
      }
    }else{
      if(s)s.textContent='SAME! 🙂 '+mpFound+' / '+total;
      mpSay('Same!');
    }
  }else{
    if(s)s.textContent='DIFFERENT! 🙃 — look and remember!';
    mpSay('Different!');
    setTimeout(function(){
      first.classList.remove('up');first.innerHTML='<span class="mp-back">❓</span>';
      card.classList.remove('up');card.innerHTML='<span class="mp-back">❓</span>';
      mpLock=false;
    },950);
  }
}
function mpShowFs(card){
  const box=document.getElementById('fsbox'),face=document.getElementById('fsface'),key=document.getElementById('fskey');
  if(!box||!face)return;
  if(key)key.style.display='none';
  face.innerHTML=MODES[curMode].apart
    ?(card.dataset.n
       ?'<span class="fs-word">'+card.dataset.n+'</span>'
       :mpArt(card.dataset.w,true))
    :mpArt(card.dataset.w,true)+'<span class="fs-word">'+card.dataset.n+'</span>';
  box.style.display='';
}
function mpShowSecretFs(){
  const box=document.getElementById('fsbox'),face=document.getElementById('fsface'),key=document.getElementById('fskey');
  if(!box||!face||!mpSecret)return;
  face.innerHTML='<span class="fs-face-inner">'+mpArt(mpSecret[0],true)+'<span class="fs-word" id="fssecretword" style="display:none">'+mpSecret[1]+'</span></span>';
  if(key){key.style.display='';key.textContent='🔑 show the word';}
  box.style.display='';
}
function mpCloseFs(){
  const box=document.getElementById('fsbox');
  if(box)box.style.display='none';
  if(mpPending)mpResolve();
}
const secretCard=document.getElementById('secretcard');
if(secretCard)secretCard.onclick=mpShowSecretFs;
const fsbox=document.getElementById('fsbox');
if(fsbox)fsbox.onclick=mpCloseFs;
const fskey=document.getElementById('fskey');
if(fskey)fskey.onclick=function(e){
  e.stopPropagation();
  const w=document.getElementById('fssecretword');
  if(!w)return;
  const show=w.style.display==='none';
  w.style.display=show?'':'none';
  this.textContent=show?'🙈 hide the word':'🔑 show the word';
};
const sndbtn=document.getElementById('sndbtn');
if(sndbtn)sndbtn.onclick=mpToggleSound;
mpApplySound();
/* ?set=toys — the deep link for the lesson (Elena sends it, kids land right) */
try{
  const q=new URLSearchParams(location.search);
  const want=q.get('set');
  if(want){
    const si=SETS.findIndex(function(s){return s.name.toLowerCase().indexOf(want.toLowerCase())>-1;});
    if(si>-1){curSet=si;}
    const m=q.get('mode');
    if(m&&m.toLowerCase().indexOf('ap')===0)curMode=1;
  }
}catch(e){}
renderSets();
renderModes();
mpDeal();
</script>
</body>
</html>
