<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Answers on the screen! 🃏</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   THE SILLY GAME — published deck (graffiti design, 2026-09-11).
   DESIGN FROZEN by Elena: the wall photo + sticker-boxes +
   frosted panel; 🎙 instead of numbers; questions on ONE line;
   playing mode = questions + whiteboard strip.
   The question BASE lives in Elena's repo:
   Library/Ideas/answers-on-the-screen/question-base.md —
   questions are changed THERE, then synced here.
   Kept from the previous version: the date rotation (today's
   game N, next lesson N+1), the ready-chime, Esc = menu,
   re-click = fresh order.
   ============================================================ */
:root{
  --cyan:#2BD9E8;
  --pink:#F03CB0;
  --orange:#FF7A29;
  --yellow:#FFC93C;
  --lime:#A8E82A;
  --frost:rgba(255,251,244,.88);
  --ink-dark:#221B30;
  --ink-dark-soft:rgba(34,27,48,.68);
  --plate:rgba(26,20,32,.78);
  --white:#fff;
  --radius:18px;
  --grad:linear-gradient(90deg,var(--cyan),var(--pink) 45%,var(--orange) 75%,var(--yellow));
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink-dark);background:#1a1420;-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:'';position:fixed;inset:0;z-index:-1;
  background:url("graffiti-wall.jpeg") center/cover no-repeat}
.wrap{height:100vh;display:flex;flex-direction:column;padding:2.6vh 4vw 2.2vh}
.eyebrow{font-family:'Permanent Marker',cursive;letter-spacing:.1em;text-transform:uppercase;font-size:clamp(.8rem,1.2vw,1.05rem);color:var(--yellow);background:var(--plate);padding:.15em .8em;border-radius:12px;margin-bottom:.35em;align-self:flex-start}
h1{font-family:'Permanent Marker',cursive;font-weight:400;font-size:clamp(2rem,4.4vw,3.8rem);line-height:1.05;color:var(--white);background:var(--plate);padding:.05em .45em;border-radius:14px;align-self:flex-start}
h1 .spray{color:var(--cyan)}
.rule{font-size:clamp(1.1rem,1.8vw,1.55rem);color:var(--ink-dark);background:var(--frost);border-radius:99px;padding:.3em 1.1em;margin-top:1.1vh;align-self:flex-start}
.rule b{color:var(--pink)}
.bar{display:flex;gap:.8em;align-items:center;flex-wrap:wrap;margin-top:1.1vh}
.deal-btn{font-family:'Permanent Marker',cursive;font-size:clamp(1.15rem,2vw,1.7rem);padding:.4em 1.2em;border:3px solid var(--white);border-radius:var(--radius);cursor:pointer;color:var(--ink-dark);background:var(--yellow);box-shadow:0 10px 30px rgba(26,20,32,.35);transition:transform .15s ease}
.deal-btn:hover{transform:scale(1.05)}
.deal-btn.on{background:linear-gradient(135deg,var(--pink),var(--orange));transform:scale(1.04)}
.reminder{margin-left:auto;font-size:clamp(.95rem,1.5vw,1.3rem);color:var(--ink-dark);background:var(--frost);border-radius:99px;padding:.3em 1em;font-style:italic}
#list{flex:1;display:none;grid-template-columns:1fr 1fr;gap:.25em 2em;align-content:center;margin-top:1vh;overflow:auto}
#list.dealt{display:grid}
.q{font-size:clamp(1.3rem,2.5vw,2.5rem);line-height:1.4;padding:.14em 0;font-weight:600;color:var(--ink-dark);white-space:nowrap}
.q::before{content:"🎙 "}
body.playing .wrap{background:var(--frost);backdrop-filter:blur(8px);border:3px solid var(--white);border-radius:0}
body.playing .wrap>*:not(#list):not(#backchip):not(#strip){display:none}
body.playing #list{display:grid;grid-template-columns:1fr 1fr;gap:.3em 2em;align-content:center;flex:1;margin-top:0}
#strip{margin-top:1.4vh;background:var(--white);border:3px solid var(--cyan);border-radius:var(--radius);box-shadow:0 10px 30px rgba(26,20,32,.35);padding:.55em 1em;display:flex;align-items:center;gap:.5em;flex-wrap:wrap}
#strip .lab{font-family:'Permanent Marker',cursive;color:var(--ink-dark);font-size:clamp(1rem,1.6vw,1.4rem);margin-right:.3em}
.chip{font-weight:700;font-size:clamp(1.35rem,2.4vw,2.1rem);padding:.22em .8em;border-radius:99px;background:var(--white);border:2px solid var(--cyan);color:var(--ink-dark);box-shadow:0 4px 10px rgba(34,27,48,.08)}
.chip.yes{background:var(--pink);border-color:var(--white);color:var(--white)}
#backchip{position:fixed;left:12px;bottom:12px;z-index:50;font-family:'Permanent Marker',cursive;font-size:clamp(1rem,1.5vw,1.3rem);padding:.35em 1em;border:3px solid var(--white);border-radius:var(--radius);cursor:pointer;background:var(--frost);color:var(--ink-dark);box-shadow:0 10px 30px rgba(26,20,32,.35);transition:transform .15s ease}
#backchip:hover{transform:scale(1.06)}
body.playing #backchip{font-size:clamp(1.4rem,2vw,1.9rem);padding:.3em .8em}
@media(max-width:900px){ #list{grid-template-columns:1fr} body.playing #list.dealt{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">The silly game · answers on the screen</div>
  <h1>Answers on the <span class="spray">screen</span>! 🃏</h1>
  <p class="rule">Any question — but the answer must come from the board. <b>Fast phrase first, then the full sentence!</b> 😄</p>

  <div class="bar">
    <button class="deal-btn" id="today-btn">🎙 today's game</button>
    <span class="reminder" id="next-line">Esc = menu · re-click = fresh order</span>
  </div>

  <div id="list"></div>

  <button id="backchip" title="back">← back to the deck</button>
<div id="strip"><span class="lab">📋 For the whiteboard:</span></div>
</div>

<script>
(function(){
  "use strict";
  const DECKS=[
    { board:["6","under the chair","rainy","hungry","my friend","Yes!"],
      questions:[
        "How many cats have you got?",
        "How many noses have you got?",
        "How many brothers have you got?",
        "Where is your homework?",
        "Where is the cat?",
        "What's the weather like in Africa?",
        "How is your dog?",
        "Who is in your school bag?",
        "Do you sleep during the lesson?",
        "Is your granny six?"
      ]},
    { board:["pink","It's hot!","6","under the chair","my friend","No!"],
      questions:[
        "What colour is your hair?",
        "What colour is your sister's hair?",
        "What's the weather like in winter?",
        "What's the weather like at the North Pole?",
        "How many heads have you got?",
        "Where does your granny live?",
        "Where do you live?",
        "Who eats your homework?",
        "Do you eat your homework?",
        "Do you live under the chair?"
      ]},
    { board:["6","rainy","my friend","hungry","during the lesson","Yes!"],
      questions:[
        "When do you brush your teeth?",
        "When do you get up?",
        "When do you wash your face?",
        "Who sings in the bathroom?",
        "Who sleeps at school?",
        "How many tails have you got?",
        "How many teachers have you got?",
        "What's the weather like in the sea?",
        "How is your cat?",
        "Do your cats sleep during the lesson?"
      ]}
  ];
  const list=document.getElementById('list');
  const strip=document.getElementById('strip');
  const chip=document.getElementById('backchip');
  const btns=[...document.querySelectorAll('.deal-btn')];
  function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
  const today=new Date().toDateString();
  let idx=0;
  try{
    const st=JSON.parse(localStorage.getItem('silly-rotation')||'{"i":-1,"d":""}');
    idx = (st.d===today) ? st.i : (st.i+1)%DECKS.length;
  }catch(e){ idx=0; }
  function deal(){
    const d=DECKS[idx];
    list.innerHTML='';
    shuffle(d.questions.slice()).forEach(q=>{
      const el=document.createElement('div');
      el.className='q'; el.textContent=q;
      list.appendChild(el);
    });
    list.classList.add('dealt');
    strip.querySelectorAll('.chip').forEach(c=>c.remove());
    d.board.forEach(w=>{
      const c=document.createElement('span');
      c.className='chip'+(w==='Yes!'||w==='No!'?' yes':'');
      c.textContent=w;
      strip.appendChild(c);
    });
    showNext();
    document.body.classList.add('playing');   /* questions + whiteboard line */
    chip.textContent='←';                     /* smartboards: tap to return */
    try{ localStorage.setItem('silly-rotation', JSON.stringify({i:idx,d:today})) }catch(e){}
  }
  function showMenu(){ document.body.classList.remove('playing'); chip.textContent='← back to the deck'; }
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') showMenu(); });
  document.getElementById('today-btn').addEventListener('click',deal);
  deal(); deal();  /* first pass paints the board, second keeps the same day's game */
  chip.addEventListener('click',()=>{
    if(document.body.classList.contains('playing')) showMenu();
    else history.back();
  });
  const nextLine=document.getElementById('next-line');
  function showNext(){
    const nx=(idx+1)%DECKS.length;
    nextLine.textContent='today: game '+(idx+1)+' · next lesson: game '+(nx+1)+' · Esc = menu · re-click = fresh order';
  }

  /* READY-CHIME (Elena, 2026-09-04) */
  (function(){
    if(!/^https?:$/.test(location.protocol))return;
    let last=null,ctx=null;
    const unlock=()=>{try{
      ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
      if(ctx.state==='suspended')ctx.resume();
    }catch(e){}};
    addEventListener('pointerdown',unlock);addEventListener('keydown',unlock);
    function chime(){try{unlock();if(!ctx)return;const t=ctx.currentTime;
      [880,1174.7].forEach((f,n)=>{
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.type='sine';o.frequency.value=f;
        g.gain.setValueAtTime(0,t+n*.18);
        g.gain.linearRampToValueAtTime(.4,t+n*.18+.02);
        g.gain.exponentialRampToValueAtTime(.001,t+n*.18+.9);
        o.connect(g);g.connect(ctx.destination);
        o.start(t+n*.18);o.stop(t+n*.18+1);
      });
    }catch(e){}}
    function poll(){
      fetch(location.href,{method:'HEAD',cache:'no-store'}).then(r=>{
        const m=r.headers.get('last-modified');
        if(!m)return;
        if(last===null){last=m;return}
        if(m!==last){last=m;chime();setTimeout(()=>location.reload(),700)}
      }).catch(()=>{});
    }
    poll();setInterval(poll,1500);
  })();
})();
</script>
</body>
</html>
