<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kid's Box 1 · Unit 2 · Lesson 8 — He/She · Pp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ "Minty Fresh" — ONE deck for the whole lesson ============
   KB1 · Unit 2 · Lesson 8 (He/She + Pp — конспект L8: he/she with the
   Star family, phonics Pp, poster 8 'pat a rat'). Same engine as KB 1
   U2 L7 (THE DECK STAYS FAMILIAR): board deck, Wi-Fi interstitial,
   reveal cards, ready-chime, build stamp. UPGRADED to the current
   standard: the ✍️ V2 window (04.10 — every slide, every pupil) with
   the corners v2: 🙋 Pardon top-left · ✍️ top-right · 🗒 bottom-centre.
   Every note: WHAT THIS IS first, then HOW TO RUN IT. */
:root{
  --mint:#95E1D3;         /* soft mint */
  --mint-deep:#5ecbb8;    /* mint accent */
  --peach:#FCE38A;        /* warm yellow */
  --lavender:#C8B6FF;     /* lavender */
  --lavender-deep:#9a7fff;/* lavender accent */
  --cream:#FFF8F0;        /* page background */
  --pink:#FF8FAB;         /* pink accent */
  --ink:#2D3436;          /* main text */
  --ink-soft:#636e72;     /* secondary text */
  --white:#ffffff;
  --radius:22px;
  --shadow:0 10px 30px rgba(45,52,54,.12);
  --shadow-lg:0 20px 50px rgba(45,52,54,.18);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Nunito',system-ui,sans-serif;background:var(--cream);color:var(--ink);overflow:hidden}
.slide>*{flex-shrink:0}   /* THE FLEX-SHRINK RULE — nothing collapses; slides scroll */
/* ============ chrome ============ */
#progress-track{position:fixed;top:0;left:0;width:100vw;height:7px;background:rgba(200,182,255,.35);z-index:100}
#progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--lavender),var(--pink));transition:width .4s cubic-bezier(.22,1,.36,1)}
#nav{
  position:fixed;bottom:14px;right:max(10px,1.6vw);z-index:100;
  display:flex;gap:8px;align-items:center;
  background:rgba(255,255,255,.85);backdrop-filter:blur(10px);
  border-radius:99px;padding:8px 14px;box-shadow:var(--shadow);
}
#nav button{
  width:44px;height:44px;border-radius:50%;border:none;
  background:var(--white);color:var(--mint-deep);font-size:1.35rem;cursor:pointer;
  box-shadow:0 2px 10px rgba(45,52,54,.10);
  transition:transform .15s ease,opacity .15s ease;font-family:inherit;
}
#nav button:hover{transform:scale(1.08)}
#nav button:disabled{opacity:.3;cursor:default;transform:none}
#nav button.fs{width:auto;border-radius:99px;padding:0 16px;font-size:1.05rem}
#counter{font-weight:800;color:var(--ink-soft);font-size:1rem;min-width:3.6em;text-align:center}
#stamp{
  position:fixed;top:12px;z-index:100;
  font-size:clamp(.7rem,1vw,.9rem);font-weight:800;color:var(--ink-soft);
  background:rgba(255,255,255,.85);border-radius:99px;padding:.3em .9em;box-shadow:var(--shadow);
}
/* ============ the pills (emoji-only row — the V2 standard, 04.10) ============ */
.pill{
  position:fixed;z-index:110;
  font-family:'Fredoka',sans-serif;font-weight:600;
  font-size:clamp(.95rem,1.4vw,1.2rem);border:none;cursor:pointer;
  border-radius:99px;padding:.45em .95em;background:rgba(255,255,255,.9);
  box-shadow:0 4px 12px rgba(45,52,54,.12);color:var(--ink-soft);
  transition:transform .15s ease,color .15s ease;
}
.pill:hover{transform:scale(1.05);color:var(--ink)}
/* THE CORNERS v2 (Elena, 04.10): Pardon → top-left · ✍️ log → top-right · 🗒 notes → bottom centre */
#pardonbtn{top:2.4vh;left:max(10px,1.6vw);right:auto;bottom:auto}
#stamp{top:12px;right:calc(max(10px,1.6vw) + 5.6em)}
.overlay{position:fixed;inset:0;z-index:200;background:rgba(255,248,240,.985);display:none;flex-direction:column;padding:4vh 6vw;overflow:auto}
.overlay.open{display:flex}
.overlay .closer{position:absolute;top:2.2vh;right:max(10px,1.6vw);font-family:'Fredoka',sans-serif;font-size:clamp(.9rem,1.4vw,1.15rem);color:var(--ink-soft);cursor:pointer}
.overlay .closer:hover{color:var(--ink)}
/* ============ slides ============ */
.slide{
  position:absolute;inset:0;
  padding:8vh 5vw calc(74px + 2.4vh);
  display:flex;flex-direction:column;gap:1.8vh;
  opacity:0;visibility:hidden;transform:translateX(60px) scale(.985);
  transition:opacity .5s cubic-bezier(.22,1,.36,1),transform .5s cubic-bezier(.22,1,.36,1),visibility .5s;
  overflow:auto;
}
.slide.active{opacity:1;visibility:visible;transform:translateX(0) scale(1)}
.slide.prev{transform:translateX(-60px) scale(.985)}
.slide.active .reveal-el{animation:rise .6s cubic-bezier(.22,1,.36,1) forwards}
.slide.active .reveal-el:nth-child(2){animation-delay:.08s}
.slide.active .reveal-el:nth-child(3){animation-delay:.16s}
.slide.active .reveal-el:nth-child(4){animation-delay:.24s}
.slide.active .reveal-el:nth-child(5){animation-delay:.32s}
.slide.active .reveal-el:nth-child(6){animation-delay:.4s}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
/* ============ the Wi-Fi interstitial ============ */
.slide.wifi{justify-content:center;align-items:center;background:#fff}
.wifi-ic{width:clamp(180px,32vw,380px);height:auto;animation:wifipulse 2.2s ease-in-out infinite}
@keyframes wifipulse{0%,100%{transform:scale(1);opacity:.92}50%{transform:scale(1.045);opacity:1}}
/* ============ content components ============ */
.eyebrow{
  font-size:clamp(1rem,1.8vw,1.4rem);font-weight:800;letter-spacing:.12em;
  text-transform:uppercase;color:var(--lavender-deep);
}
h1.title{
  font-family:'Fredoka',sans-serif;font-weight:700;
  font-size:clamp(1.9rem,4.2vw,3.6rem);line-height:1.1;color:var(--ink);
}
.accent-line{width:120px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--mint),var(--lavender))}
.card{
  background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:clamp(14px,2.2vh,24px) clamp(16px,2vw,28px);
}
.card.mint{background:#eafbf6}
.card.peach{background:#fff8db}
.card.lavender{background:#f1ecff}
.card.pink{background:#ffe9f0}
.card p,.card li{font-size:clamp(1.3rem,2.3vw,2rem);line-height:1.4}
.task{
  background:var(--peach);border-radius:99px;align-self:flex-start;
  padding:.45em 1.2em;font-size:clamp(1.2rem,2.1vw,1.7rem);font-weight:800;color:var(--ink);
}
.reveal-btn{
  font-family:'Fredoka',sans-serif;font-size:clamp(1.15rem,2vw,1.6rem);font-weight:700;
  color:var(--ink);background:var(--mint);border:none;border-radius:99px;
  padding:.55em 1.5em;cursor:pointer;transition:transform .15s ease;align-self:flex-start;
  box-shadow:var(--shadow);
}
.reveal-btn:hover{transform:scale(1.06)}
.answer{
  display:none;font-family:'Fredoka',sans-serif;font-weight:700;
  font-size:clamp(1.7rem,3.4vw,3rem);color:var(--ink);
  background:var(--mint);border-radius:var(--radius);padding:.4em 1em;align-self:flex-start;
}
.answer.show{display:inline-block;animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
.answer b{color:var(--pink)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
/* flashcard grids */
.fc-grid{display:flex;flex-wrap:wrap;gap:clamp(10px,1.6vw,20px);align-items:stretch;justify-content:center}
.fc{
  background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:clamp(8px,1.2vh,14px);cursor:pointer;user-select:none;
  display:flex;flex-direction:column;align-items:center;gap:.4vh;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s ease;
  flex:0 1 auto;min-width:0;
}
.fc img{height:clamp(90px,16vh,150px);border-radius:12px}
.fc .fc-emoji{font-size:clamp(3.2rem,8vh,5.6rem);line-height:1.15;display:block}
.fc .fc-name{
  font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(1rem,1.7vw,1.5rem);
  color:var(--ink);min-height:1.3em;
}
.fc:hover{transform:translateY(-4px) scale(1.03)}
.fc.picked{transform:scale(1.07);box-shadow:0 0 0 6px var(--mint),var(--shadow-lg)}
.fc.gone{visibility:hidden}
/* big left/right arrows (the goodbye song) */
.lr-row{display:flex;gap:clamp(20px,4vw,60px);justify-content:center;align-items:center}
.lr{display:flex;flex-direction:column;align-items:center;gap:1vh;cursor:pointer;user-select:none}
.lr .arrow{font-size:clamp(4rem,11vh,8rem);line-height:1;animation:wifipulse 2s ease-in-out infinite}
.lr .lr-word{
  font-family:'Fredoka',sans-serif;font-weight:700;
  font-size:clamp(1.8rem,4vw,3.2rem);background:var(--white);border-radius:18px;
  padding:.15em .6em;box-shadow:var(--shadow);
}
.lr.left .arrow{color:#5ecbb8}
.lr.right .arrow{color:#FF8FAB}
audio{width:min(560px,100%);margin-top:.4vh}
video{width:min(560px,92%);border-radius:18px;display:block;box-shadow:var(--shadow-lg)}
img.sheet{width:min(640px,92%);border-radius:16px;display:block;box-shadow:var(--shadow-lg);background:#fff}
img.sheet.small{width:min(430px,90%)}
.linkcard{
  display:inline-block;background:var(--lavender);color:var(--ink);text-decoration:none;
  font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(1.2rem,2.2vw,1.8rem);
  border-radius:99px;padding:.6em 1.6em;box-shadow:var(--shadow);cursor:pointer;
  transition:transform .15s ease;align-self:flex-start;
}
.linkcard:hover{transform:scale(1.05)}
/* THE SIGHT-READING REVEAL — tap a picture → the word FULL SCREEN, huge */
#bigword{z-index:300;cursor:pointer;align-items:center;justify-content:center;gap:0}
#bigword .bw{font-family:'Fredoka',sans-serif;font-weight:700;line-height:1.05;text-align:center;color:var(--ink);animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
#bigword .bw .art{display:block;font-size:clamp(1.6rem,4vw,3.4rem);color:var(--mint-deep);margin-bottom:1.5vh}
#bigword .bw .noun{display:block;font-size:clamp(4.5rem,17vh,11rem);letter-spacing:.02em}
#bigword .tap-hint{position:absolute;bottom:6vh;left:0;right:0;text-align:center;font-size:clamp(.9rem,1.5vw,1.2rem);color:var(--ink-soft)}

</head>
<body>

<div id="progress-track"><div id="progress-fill"></div></div>
<div id="stamp">KB 1 · U2 · L8 · build 08.10 · v5</div>

<!-- 1 · WARM UP — HELLO SONG -->
<section class="slide">
  <div class="eyebrow reveal-el">🎵 Song time</div>
  <h1 class="title reveal-el">Hello! How are you? 👋</h1>
  <div class="accent-line reveal-el"></div>
  <div class="task reveal-el">🎯 Sing and do the actions!</div>
  <video class="reveal-el" controls preload="metadata" src="../media/kb1-u1-hello.mp4"></video>
  <div class="card mint reveal-el"><p>💬 The circle: <b style="color:var(--mint-deep)">How are you? · How old are you? · What colour do you like?</b> ⭕</p></div>
  <div class="card peach reveal-el" style="max-width:760px">
    <p style="font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(1rem,1.7vw,1.35rem);color:var(--lavender-deep)">🧺 Prepare ahead</p>
    <p style="font-size:clamp(.85rem,1.35vw,1.1rem);line-height:1.55">
      🃏 flashcards: <b>Simon · Suzy · Stella · Meera</b> + the classroom objects &nbsp;·&nbsp; 📄 worksheets: <b>Rule · Complete · Circle · Pp</b><br>
      📄 <b>PW1 AB p. 5</b> — a copy per child (tick!) &nbsp;·&nbsp; 💻 the <b>GE app</b> on Farida's computer (rock-paper-scissors!) &nbsp;·&nbsp; 🧵 the <b>puppet sheet</b> (TB p. 98) — one per child<br>
      🖼️ poster <b>8</b> + the small versions &nbsp;·&nbsp; 🧴 <b>GLUE</b> &nbsp;·&nbsp; 🖍️ coloured pencils &nbsp;·&nbsp; 🖊️ a pen &nbsp;·&nbsp; 🐷 a toy pig
    </p>
  </div>
</section>

<!-- 2 · FIRST SONG — LEFT AND RIGHT (the homework check, item 3) -->
<section class="slide">
  <div class="eyebrow reveal-el">🎵 Song time — you know it!</div>
  <h1 class="title reveal-el">Left and right — YOU know it! 🎤</h1>
  <div class="accent-line reveal-el"></div>
  <div class="task reveal-el">🎯 Stand up — sing and DO!</div>
  <div class="lr-row reveal-el">
    <div class="lr left"><span class="arrow">⬅️</span><span class="lr-word">LEFT</span></div>
    <div class="lr right"><span class="arrow">➡️</span><span class="lr-word">RIGHT</span></div>
  </div>
  <audio controls preload="none" class="reveal-el" src="../media/kb1-u2-ge-left-right.mp3"></audio>
  <div class="card peach reveal-el"><p>🏠 Did you sing it at home? — <b style="color:var(--lavender-deep)">Show me the moves!</b> 👏</p></div>
</section>

<!-- 3 · GAME — LIGHTS, CAMERA, ACTION! (the director) -->
<section class="slide">
  <div class="eyebrow reveal-el">🎬 Game time</div>
  <h1 class="title reveal-el">Lights, camera, action! 🎬</h1>
  <div class="accent-line reveal-el"></div>
  <div class="task reveal-el">🎯 You shout — I direct — you DO!</div>
  <div class="card peach reveal-el"><p>🎬 All together: <b style="color:var(--lavender-deep)">«Lights, camera… ACTION!»</b></p></div>
  <div class="card reveal-el"><p><button class="reveal-btn" onclick="reveal(this)">🎬 action 1 ▾</button> <span class="answer" style="font-size:1.15em;padding:.15em .6em">2 steps <b>LEFT!</b> ⬅️</span></p></div>
  <div class="card reveal-el"><p><button class="reveal-btn" onclick="reveal(this)">🎬 action 2 ▾</button> <span class="answer" style="font-size:1.15em;padding:.15em .6em">3 jumps <b>RIGHT!</b> ➡️</span></p></div>
  <div class="card reveal-el"><p><button class="reveal-btn" onclick="reveal(this)">🎬 action 3 ▾</button> <span class="answer" style="font-size:1.15em;padding:.15em .6em"><b>Forward and back!</b> ⬆️⬇️</span></p></div>
  <div class="card reveal-el"><p><button class="reveal-btn" onclick="reveal(this)">🎬 action 4 ▾</button> <span class="answer" style="font-size:1.15em;padding:.15em .6em"><b>Spin around!</b> 🌀</span></p></div>
  <div class="card reveal-el"><p><button class="reveal-btn" onclick="reveal(this)">🎬 action 5 ▾</button> <span class="answer" style="font-size:1.15em;padding:.15em .6em"><b>Jump, jump, jump!</b> 🦘🦘🦘</span></p></div>
  <div class="card reveal-el"><p><button class="reveal-btn" onclick="reveal(this)">🎬 action 6 ▾</button> <span class="answer" style="font-size:1.15em;padding:.15em .6em"><b>…and SIT DOWN!</b> 🪑</span></p></div>
</section>

<!-- 4 · READING — PB p. 11 ex. 1, THE CHANT (the homework check, item 2) -->
<section class="slide">
  <div class="eyebrow reveal-el">Reading · homework check 📖</div>
  <h1 class="title reveal-el">Say the chant — smoothly! 📖</h1>
  <div class="accent-line reveal-el"></div>
  <div class="task reveal-el">🎯 Finger on the page — read along!</div>
  <img class="sheet reveal-el" src="../media/kb1-u2-pb11.png" alt="PB p. 11 — the school-things chant">
  <audio controls preload="none" class="reveal-el" src="../media/kb1-u2-pb11-t15.mp3"></audio>
  <button class="reveal-btn reveal-el" onclick="reveal(this)">words ▾</button>
  <div class="answer reveal-el" style="font-size:clamp(1.2rem,2.4vw,2rem)">A pencil · a book · an eraser · a pen · a table · a chair — say it again!</div>
  <div class="card peach reveal-el"><p>📱 Who recorded it <b style="color:var(--lavender-deep)">in the app?</b> 👏 &nbsp; 🎴 And the <b style="color:var(--lavender-deep)">shkola cards?</b> ✋</p></div>
</section>

<!-- 5 · WI-FI (pencil time) -->
<section class="slide wifi">
  <svg class="wifi-ic reveal-el" viewBox="0 0 100 72" aria-label="Wi-Fi">
    <g fill="none" stroke="#5ecbb8" stroke-width="9" stroke-linecap="round">
      <path d="M13.2 24.2 A52 52 0 0 1 86.8 24.2"/>
      <path d="M24.5 35.5 A36 36 0 0 1 75.5 35.5"/>
      <path d="M35.9 46.9 A20 20 0 0 1 64.1 46.9"/>
    </g>
    <circle cx="50" cy="60" r="8.5" fill="#5ecbb8"/>
  </svg>
</section>

<!-- 6 · THE PENCIL SONG -->
<section class="slide">
  <div class="eyebrow reveal-el">🎵 Pencil time!</div>
  <h1 class="title reveal-el">Hold your pencil up! ✏️</h1>
  <div class="accent-line reveal-el"></div>
  <div class="task reveal-el">🎯 Sing — DO it with your pencil!</div>
  <audio controls preload="none" class="reveal-el" src="../media/pab-1-6-hold-your-pencil-up.mp3"></audio>
</section>

<!-- 7 · PW1 p.5 ex.3 — LISTEN, POINT, WRITE THE NUMBER -->
<section class="slide">
  <div class="eyebrow reveal-el">Listening game 👂</div>
  <h1 class="title reveal-el">Listen, point — write 1·2·3·4!</h1>
  <div class="accent-line reveal-el"></div>
  <div class="task reveal-el">🎯 Listen — point — number the pictures!</div>
  <img class="sheet small reveal-el" src="../media/pw1-p5-ex3.png" alt="four actions: stand up, stretch, shout Hooray, sit down">
  <audio controls preload="none" class="reveal-el" src="../media/pw1-cd1-5.mp3"></audio>
  <div class="card peach reveal-el"><p>🙌 Then DO them all: <b style="color:var(--lavender-deep)">stand up · stretch · HOORAY! · sit down!</b></p></div>
</section>

<!-- 8 · PW1 AB p.5 ex.2 — LISTEN AND TICK -->
<section class="slide">
  <div class="eyebrow reveal-el">AB p. 5 · Listening 👂</div>
  <h1 class="title reveal-el">Listen and tick! ✓</h1>
  <div class="accent-line reveal-el"></div>
  <div class="task reveal-el">🎯 Listen — tick the right picture!</div>
  <img class="sheet small reveal-el" src="../media/pw1-ab-p5-ex2.png" alt="AB p. 5 — listen and tick: the four actions">
  <audio controls preload="none" class="reveal-el" src="../media/pw1-cd1-6.mp3"></audio>
  <button class="reveal-btn reveal-el" onclick="reveal(this)">key ▾</button>
  <div class="answer reveal-el" style="font-size:clamp(1.1rem,2.2vw,1.8rem)">2 shout «Hooray!» · 3 stretch · 4 sit down &nbsp;<span style="font-size:.75em">(1 stand up — the book's example ✓)</span></div>
</section>

<!-- 9 · GAME — ROCK, PAPER, SCISSORS (Part 1, the reminder) -->
<section class="slide">
  <div class="eyebrow reveal-el">Game time ✊✋✌️</div>
  <h1 class="title reveal-el">Rock, paper, scissors!</h1>
  <div class="accent-line reveal-el"></div>
  <div class="task reveal-el">🎯 In pairs — the winner shouts a word!</div>
  <div class="fc-grid reveal-el">
    <div class="fc"><span class="fc-emoji">✊</span><div class="fc-name">ROCK</div></div>
    <div class="fc"><span class="fc-emoji">✋</span><div class="fc-name">PAPER</div></div>
    <div class="fc"><span class="fc-emoji">✌️</span><div class="fc-name">SCISSORS</div></div>
  </div>
  <div class="card peach reveal-el"><p>🥁 Say it together: <b style="color:var(--lavender-deep)">«Rock… paper… scissors… GO!»</b></p></div>
  <div class="card mint reveal-el"><p>🏆 Winner shouts: <b style="color:var(--mint-deep)">«A pencil! A book!»</b> — the loser does a mime: <b style="color:var(--mint-deep)">stretch! jump!</b> 😄</p></div>
</section>

<!-- 10 · READING M — THE BRANDS DECK (the doorway) -->
<section class="slide">
  <div class="eyebrow reveal-el">Reading · brands 🔤</div>
  <h1 class="title reveal-el">M m says m-m-m! 🏷️</h1>
  <div class="accent-line reveal-el"></div>
  <div class="task reveal-el">🎯 Lips together — mmm!</div>
  <div class="card lavender reveal-el" style="text-align:center;align-self:stretch">
    <p style="font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(4rem,13vh,9rem);line-height:1.1">M m</p>
    <p style="font-size:clamp(1.2rem,2.2vw,1.8rem)">mmm… 🤫 lips together!</p>
  </div>
  <div class="card peach reveal-el"><p>🏷️ The <b style="color:var(--lavender-deep)">brands you know</b> — let's read them! ▶ <b style="color:var(--lavender-deep)">brand-phonics-m</b></p></div>
</section>

<!-- 11 · GUIDED DISCOVERY — ONE / TWO (the re-teach from L7) -->
<section class="slide">
  <div class="eyebrow reveal-el">One and many… ✨</div>
  <h1 class="title reveal-el">1 pencil · 2 pencil<span style="color:var(--pink)">s</span>!</h1>
  <div class="accent-line reveal-el"></div>

<script>
const slides=[...document.querySelectorAll('.slide')];
let cur=0;
const fill=document.getElementById('progress-fill'),
      cnt=document.getElementById('counter'),
      prev=document.getElementById('prev'),
      next=document.getElementById('next');
let showWatch;
function show(n){
  if(n<0||n>=slides.length)return;
  slides.forEach((s,i)=>{s.classList.toggle('active',i===n);s.classList.toggle('prev',i<n);});
  cur=n;
  fill.style.width=((n+1)/slides.length*100)+'%';
  cnt.textContent=(n+1)+' / '+slides.length;
  prev.disabled=n===0;next.disabled=n===slides.length-1;
  clearTimeout(showWatch);
  showWatch=setTimeout(()=>{const a=slides[n];if(a)a.querySelectorAll('.reveal-el').forEach(el=>{el.style.animation='none';});},1500);
}
function go(n){
  if(n<0||n>=slides.length)return;
  if(document.querySelector('.overlay.open'))return;
  show(n);
  document.querySelectorAll('audio,video').forEach(a=>{try{a.pause()}catch(e){}});
  history.replaceState(null,'','#'+(n+1));
}
prev.onclick=()=>go(cur-1);next.onclick=()=>go(cur+1);
document.getElementById('fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();

function missOne(btn){
  const cards=[...document.querySelectorAll('#wmiss .fc')];
  const hidden=cards.filter(c=>c.classList.contains('gone'));
  if(hidden.length){ hidden.forEach(c=>c.classList.remove('gone')); btn.textContent='👀 Close your eyes!'; return; }
  const vis=cards.filter(c=>!c.classList.contains('gone'));
  if(!vis.length) return;
  vis[Math.floor(Math.random()*vis.length)].classList.add('gone');
  btn.textContent='↺ Show it back';
}
/* ============ keys & gestures ============ */
document.addEventListener('keydown',e=>{
  /* ⌘S / Ctrl+S = save + close while the log window is open — the one combo we own */
  if(/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(e.metaKey||e.ctrlKey||e.altKey) return; /* ⌘C / Ctrl+C copy must work */
  if(e.key==='Escape'){togglePardon(false);document.getElementById('bigword').classList.remove('open');}
  if((e.key==='p'||e.key==='P'||e.key==='з'||e.key==='З')){e.preventDefault();togglePardon();}
  if(document.querySelector('.overlay.open'))return;
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1);}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1);}
  if(e.key==='Home')go(0);
  if(e.key==='End')go(slides.length-1);
  if(e.key==='f'||e.key==='F'||e.key==='а'||e.key==='А')document.getElementById('fs').click();
});
let wl=0;
document.addEventListener('wheel',e=>{
  const now=Date.now();if(now-wl<650||Math.abs(e.deltaY)<25)return;wl=now;
  go(cur+(e.deltaY>0?1:-1));
},{passive:true});
let tx=0;
document.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>60)go(cur+(dx<0?1:-1));
},{passive:true});
function reveal(btn){
  const a=btn.nextElementSibling;
  if(a){a.classList.add('show');}
  btn.style.display='none';
}
/* THE SIGHT-READING REVEAL: tap a picture → the word full screen (kept from the L6 engine) */
function bigWord(art,noun){
  const ov=document.getElementById('bigword');
  ov.querySelector('.art').textContent=art;
  ov.querySelector('.noun').textContent=noun;
  ov.classList.add('open');
}
const h=parseInt(location.hash.slice(1));
show(isNaN(h)?0:h-1);
</script>

<script>
/* READY-CHIME: the open window chimes and reloads when a new version is saved. */
(function(){
  if(!/^https?:$/.test(location.protocol))return;
  let last=null,ctx=null;
  const unlock=()=>{try{
    ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==='suspended')ctx.resume();
  }catch(e){}};
  addEventListener('pointerdown',unlock);addEventListener('keydown',unlock);
  function chime(){try{unlock();if(!ctx)return;const t=ctx.currentTime;
    [880,1174.7].forEach((f,n)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0,t+n*.18);
      g.gain.linearRampToValueAtTime(.4,t+n*.18+.02);
      g.gain.exponentialRampToValueAtTime(.001,t+n*.18+.9);
      o.connect(g);g.connect(ctx.destination);
      o.start(t+n*.18);o.stop(t+n*.18+1);
    });
  }catch(e){}}
  function poll(){
    fetch(location.pathname,{method:'HEAD',cache:'no-store'}).then(r=>{
      const m=r.headers.get('last-modified');
      if(!m)return;
      if(last===null){last=m;return}
      if(m!==last){last=m;chime();setTimeout(()=>location.reload(),700)}
    }).catch(()=>{});
  }
  poll();setInterval(poll,1500);
})();
</script>
